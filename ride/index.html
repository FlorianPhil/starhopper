<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<title>Starhopper</title>
<style>body{background:#10171d;color:#ecf3f7;font:18px system-ui;margin:10vw}button{font:inherit;padding:12px}</style>
</head><body><h1>Starhopper</h1><p id="status" role="status">Opening your soundboard…</p><button hidden onclick="location.reload()">Retry</button>
<script>
(async () => {
  const status = document.getElementById("status");
  const fragment = location.hash.slice(1);
  if (!/^[A-Za-z0-9_-]{43}$/.test(fragment)) {
    status.textContent = "Open the full private link to load your sounds.";
    return;
  }
  try {
    const raw = Uint8Array.from(atob(fragment.replaceAll("-", "+").replaceAll("_", "/") + "="), c => c.charCodeAt(0));
    const key = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
    const response = await fetch("board.bin", {cache:"no-cache"});
    if (!response.ok) throw new Error("Download failed");
    const bytes = new Uint8Array(await response.arrayBuffer());
    const plain = await crypto.subtle.decrypt({name:"AES-GCM",iv:bytes.slice(0,12)}, key, bytes.subarray(12));
    const html = await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
    document.open();
    document.write(html);
    document.close();
  } catch {
    status.textContent = "The board could not open. Check your connection and retry using the full link.";
    document.querySelector("button").hidden = false;
  }
})();
</script></body></html>
