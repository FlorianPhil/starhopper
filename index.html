<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#10171d" />
    <title>Starhopper · Flight deck</title>
    <link rel="icon" href="img/icon.svg" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="css/cockpit.css" />
    <script defer src="js/main.js"></script>
    <script defer src="offline.js"></script>
  </head>
  <body>
    <main>
      <header>
        <span class="wordmark"><img src="img/icon.svg" alt="" />STARHOPPER</span
        ><span>SH-7 / FLIGHT DECK</span>
      </header>
      <section class="display" aria-label="Flight playback">
        <div class="orbit" aria-hidden="true"></div>
        <div class="screen">
          <small id="state" role="status">On standby</small>
          <h1 id="title">Combat</h1>
          <p id="caption">Battle stations</p>
          <button id="transport">
            <span aria-hidden="true" id="glyph">▶</span>
            <span id="action">Play Combat</span>
          </button>
        </div>
      </section>
      <section>
        <h2>Flight mode</h2>
        <div class="modes" id="modes">
          <button data-mode="combat" aria-pressed="true">Combat</button
          ><button data-mode="cruise" aria-pressed="false">Cruise</button
          ><button data-mode="stealth" aria-pressed="false">Stealth</button
          ><button data-mode="warp" aria-pressed="false">Warp</button
          ><button data-mode="emergency" aria-pressed="false">Emergency</button>
        </div>
      </section>
      <section class="drive">
        <h2>Engine</h2>
        <div id="drives">
          <button data-drive="glide" aria-pressed="true">Glide</button
          ><button data-drive="boost" aria-pressed="false">Boost</button
          ><button data-drive="overdrive" aria-pressed="false">
            Overdrive
          </button>
        </div>
      </section>
      <section>
        <h2>Ship radio</h2>
        <div class="cues" id="cues">
          <button data-cue="scan">Scan</button
          ><button data-cue="shield">Shields</button
          ><button data-cue="boost">Thruster</button
          ><button data-cue="alert">Alert</button
          ><button data-cue="signal">Signal</button
          ><button data-cue="confirm">Confirm</button
          ><button data-cue="voice">Crew report</button>
        </div>
      </section>
      <details>
        <summary>Before the ride</summary>
        <p>
          Save the deck on this phone while online. The passenger can run the
          radio while the driver listens.
        </p>
        <button id="offline">Save for trip</button>
        <p id="offline-status" role="status"></p>
        <label for="theme">Emergency soundtrack</label>
        <p id="theme-note">
          Emergency uses the Combat overdrive mix. Choose a song to keep on this
          device.
        </p>
        <input type="file" id="theme" accept="audio/*,.mp3,.m4a" />
        <p id="theme-status" role="status"></p>
      </details>
      <audio id="player" preload="auto" playsinline></audio>
    </main>
  </body>
</html>
